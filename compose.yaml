name: crm

x-backend: &backend
  image: crm-backend:local
  build: ./backend
  environment: &backend-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD:-crm_local_password}@postgres:5432/${POSTGRES_DB:-crm}

services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crm_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-crm}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *backend
    command: ["npm", "run", "prisma:migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend
    environment:
      <<: *backend-env
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env (at least 32 characters)}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@crm.local}
      PORT: 4000
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-4000}
        NEXT_PUBLIC_DEMO_MODE: "false"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  studio:
    <<: *backend
    environment:
      <<: *backend-env
      STUDIO_PORT: ${STUDIO_PORT:-5555}
    # Match Studio's port to the browser origin for its asset security checks.
    # Forward a separate container port because Studio binds to loopback.
    command:
      - sh
      - -c
      - socat TCP-LISTEN:5554,bind=0.0.0.0,fork,reuseaddr TCP:127.0.0.1:$${STUDIO_PORT} & exec npm run prisma:studio -- --port "$${STUDIO_PORT}" --browser none
    ports:
      - "127.0.0.1:${STUDIO_PORT:-5555}:5554"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
